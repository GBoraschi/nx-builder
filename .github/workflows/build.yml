name: Compilar NX2Apple IPA

on:
  workflow_dispatch:
    inputs:
      gerar_romfs:
        description: 'Gerar e enviar a pasta RomFS pela nuvem?'
        required: true
        default: true
        type: boolean

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Clonar o repositorio NX2Apple
        run: git clone https://github.com/LNPANDY/NX2Apple.git repo

      - name: Instalar dependencias e Metal Toolchain no Mac
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd spirv-cross glslang aria2
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'" nsz cryptography

      - name: Baixar e extrair jogo.zip do Hugging Face
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p game_input output_files/romfs
          aria2c -x 16 -s 16 --header="Authorization: Bearer $HF_TOKEN" "$GAME_URL" -o game.zip
          unzip -q game.zip -d game_input
          rm game.zip
          find game_input -mindepth 2 -type f -exec mv -f {} game_input/ \;
          echo "Arquivos na pasta game_input:"
          ls -lh game_input

      - name: Converter XCI para NSP (Python nativo) e gerar Slim IPA
        run: |
          KEYS_PATH=$(find game_input -iname "prod.keys*" | head -n 1)
          if [ -z "$KEYS_PATH" ]; then
            echo "ERRO: Arquivo prod.keys nao encontrado dentro do zip!"
            exit 1
          fi
          KEYS_ABS=$(cd "$(dirname "$KEYS_PATH")" && pwd)/$(basename "$KEYS_PATH")
          echo "Usando arquivo de chaves: $KEYS_ABS"

          python3 - "$KEYS_ABS" << 'EOF'
          import os, sys, glob, struct, re
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

          keys_path = sys.argv[1]
          header_key = None
          with open(keys_path, "r", encoding="utf-8", errors="ignore") as kf:
              for line in kf:
                  if "=" in line:
                      k, v = [x.strip() for x in line.split("=", 1)]
                      if k == "header_key":
                          header_key = bytes.fromhex(v)

          def get_nca_tid(f, abs_offset):
              if not header_key:
                  return None
              f.seek(abs_offset + 0x200)
              sec1 = f.read(0x200)
              if len(sec1) < 0x200:
                  return None
              for endian in ("big", "little"):
                  tweak = (1).to_bytes(16, endian)
                  dec = Cipher(algorithms.AES(header_key), modes.XTS(tweak)).decryptor().update(sec1)
                  if dec[:4] in (b"NCA3", b"NCA2", b"NCA0"):
                      tid = struct.unpack("<Q", dec[0x10:0x18])[0]
                      return f"{tid:016X}"
              return None

          for xci_path in glob.glob("game_input/*.[xX][cC][iI]"):
              print(f"Convertendo XCI para NSP: {xci_path}")
              with open(xci_path, "rb") as f:
                  head = f.read(0x20000)
                  base_off = 0x200 if head[0x300:0x304] == b"HEAD" else 0
                  if head[base_off + 0x100 : base_off + 0x104] == b"HEAD":
                      hfs0_off = base_off + struct.unpack("<Q", head[base_off + 0x130 : base_off + 0x138])[0]
                  else:
                      hfs0_off = 0xF000

                  f.seek(hfs0_off)
                  magic, num_files, str_size, _ = struct.unpack("<4sIII", f.read(16))
                  if magic != b"HFS0":
                      raise RuntimeError(f"HFS0 invalido em {hex(hfs0_off)}")
                  entries = [struct.unpack("<QQIIQ32s", f.read(64)) for _ in range(num_files)]
                  str_tab = f.read(str_size)
                  root_data = hfs0_off + 16 + num_files * 64 + str_size

                  sec_off = None
                  for f_off, f_sz, n_off, _, _, _ in entries:
                      name = str_tab[n_off:].split(b"\x00", 1)[0].decode("utf-8", "ignore")
                      if name == "secure":
                          sec_off = root_data + f_off
                          break
                  if sec_off is None:
                      raise RuntimeError("Particao secure nao encontrada no XCI!")

                  f.seek(sec_off)
                  smagic, snum, sstr_size, _ = struct.unpack("<4sIII", f.read(16))
                  sentries = [struct.unpack("<QQIIQ32s", f.read(64)) for _ in range(snum)]
                  sstr_tab = f.read(sstr_size)
                  sec_data = sec_off + 16 + snum * 64 + sstr_size

                  groups = {}
                  fallback_files = []
                  for f_off, f_sz, n_off, _, _, _ in sentries:
                      fname = sstr_tab[n_off:].split(b"\x00", 1)[0].decode("utf-8", "ignore")
                      abs_off = sec_data + f_off
                      tid = None
                      if fname.lower().endswith(".nca"):
                          tid = get_nca_tid(f, abs_off)
                      elif fname.lower().endswith((".tik", ".cert")) and len(fname) >= 16:
                          tid = fname[:16].upper()
                      if tid:
                          groups.setdefault(tid, []).append((fname, abs_off, f_sz))
                      else:
                          fallback_files.append((fname, abs_off, f_sz))

                  if not groups:
                      groups["0100000000000000"] = fallback_files
                  elif fallback_files:
                      first_tid = sorted(groups.keys())[0]
                      groups[first_tid].extend(fallback_files)

                  for tid, flist in groups.items():
                      ver = "v65536" if tid.endswith("800") else "v0"
                      out_nsp = os.path.join("game_input", f"{tid}[{ver}].nsp")
                      print(f"Gerando {out_nsp} ({len(flist)} arquivos)...")
                      str_buf = bytearray()
                      pfs_entries = []
                      cur_off = 0
                      for fname, abs_off, f_sz in flist:
                          n_off = len(str_buf)
                          str_buf.extend(fname.encode("utf-8") + b"\x00")
                          pfs_entries.append((cur_off, f_sz, n_off, abs_off))
                          cur_off += f_sz
                      hdr_len = 16 + len(flist) * 24 + len(str_buf)
                      pad = (32 - (hdr_len % 32)) % 32
                      str_buf.extend(b"\x00" * pad)

                      with open(out_nsp, "wb") as out:
                          out.write(struct.pack("<4sIII", b"PFS0", len(flist), len(str_buf), 0))
                          for rel_off, f_sz, n_off, _ in pfs_entries:
                              out.write(struct.pack("<QQII", rel_off, f_sz, n_off, 0))
                          out.write(str_buf)
                          for _, f_sz, _, abs_off in pfs_entries:
                              f.seek(abs_off)
                              rem = f_sz
                              while rem > 0:
                                  chunk = f.read(min(16 * 1024 * 1024, rem))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  rem -= len(chunk)
              os.remove(xci_path)
          EOF

          echo "Arquivos NSP prontos em game_input:"
          ls -lh game_input

          cd repo
          # Detecta o Title ID base (terminado em 000) para passar ao script caso nao seja Zelda BotW
          BASE_TID=$(ls ../game_input/*.nsp 2>/dev/null | grep -oE '[0-9A-Fa-f]{13}000' | head -n 1 | tr '[:lower:]' '[:upper:]')
          echo "Title ID Base detectado: $BASE_TID"

          PKG_FLAG=""
          if [ -n "$BASE_TID" ] && [ "$BASE_TID" != "01007EF00011E000" ]; then
            # Procura no repositorio se existe um nome de pacote associado a esse Title ID
            PKG_NAME=$(python3 -c "
          import os, re, json
          tid = '$BASE_TID'
          for root, _, files in os.walk('.'):
              for fn in files:
                  if fn.endswith(('.py', '.json', '.tsv', '.toml')):
                      p = os.path.join(root, fn)
                      try:
                          txt = open(p, errors='ignore').read()
                          if tid.lower() in txt.lower():
                              for line in txt.splitlines():
                                  if tid.lower() in line.lower():
                                      print(f'Match em {p}: {line.strip()}', file=__import__('sys').stderr)
                                      m = re.search(r'[\"\x27]([a-z0-9_-]+)[\"\x27]\s*:', line)
                                      if m and m.group(1).lower() != 'title_id':
                                          print(m.group(1))
                                          raise SystemExit
                      except SystemExit:
                          raise
                      except Exception:
                          pass
          " | head -n 1)
            if [ -n "$PKG_NAME" ]; then
              echo "Pacote correspondente encontrado: $PKG_NAME"
              PKG_FLAG="-p $PKG_NAME"
            else
              echo "Usando Title ID diretamente no parametro -p: $BASE_TID"
              PKG_FLAG="-p $BASE_TID"
            fi
          fi

          python3 scripts/build_ipa_from_nsp.py ../game_input -k "$KEYS_ABS" $PKG_FLAG -o ../output_files/Game.ipa --keep-extracted --allow-other-metal

      - name: Empacotar RomFS em blocos de 200MB
        if: ${{ inputs.gerar_romfs == true }}
        run: |
          cd repo
          ROMFS_DIR=$(find _build -type d \( -name "romfs" -o -name "rom" -o -name "content" \) | head -n 1)
          if [ -n "$ROMFS_DIR" ]; then
            echo "Empacotando RomFS encontrado em: $ROMFS_DIR"
            python3 dm/tools/romfs_arc.py pack "$ROMFS_DIR" ../output_files/romfs/romfs --shard-mib 200
          fi

      - name: Salvar IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: NX2Apple-Slim-IPA
          path: output_files/Game.ipa

      - name: Salvar RomFS para download
        if: ${{ inputs.gerar_romfs == true }}
        uses: actions/upload-artifact@v4
        with:
          name: NX2Apple-RomFS
          path: output_files/romfs/
