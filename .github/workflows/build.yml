name: Compilar NX2Apple IPA (Super Mario Odyssey)

on:
  workflow_dispatch:
    inputs:
      gerar_romfs:
        description: 'Gerar e enviar o arquivo romfs.img pela nuvem?'
        required: true
        default: true
        type: boolean

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  DM_PSO_GPUS: "none"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Clonar NX2Apple e desativar trava de espaco em disco
        run: |
          git clone https://github.com/LNPANDY/NX2Apple.git repo
          
          # Desativa qualquer trava de espaco livre em disco (free_gb retorna 999 GB)
          python3 - << 'EOF'
          import os, re
          for root, dirs, files in os.walk("repo"):
              if ".git" in dirs:
                  dirs.remove(".git")
              for fn in files:
                  p = os.path.join(root, fn)
                  try:
                      txt = open(p, "r", encoding="utf-8").read()
                  except Exception:
                      continue
                  orig = txt
                  txt = re.sub(r'return shutil\.disk_usage\(p\)\.free / 2\*\*30', 'return 999.0', txt)
                  if "GB free" in txt or "less than" in txt:
                      txt = re.sub(r'\b21\b', '1', txt)
                  if txt != orig:
                      print("Trava de espaco desativada em:", p)
                      open(p, "w", encoding="utf-8").write(txt)
          EOF

      - name: Instalar dependencias (Preservando o iOS SDK do Xcode 26)
        run: |
          sudo rm -rf /Users/runner/hostedtoolcache/* || true
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd spirv-cross glslang aria2
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'" nsz cryptography
          df -h

      - name: Baixar e extrair jogo.zip do Hugging Face
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p game_input output_files/romfs
          aria2c -x 16 -s 16 --header="Authorization: Bearer $HF_TOKEN" "$GAME_URL" -o game.zip
          unzip -q game.zip -d game_input
          rm game.zip
          find game_input -maxdepth 2 -mindepth 2 -type f -exec mv -f {} game_input/ \; || true
          echo "Arquivos na pasta game_input:"
          ls -lh game_input

      - name: Restaurar Cache de Shaders (Super Mario Odyssey)
        id: cache-shaders
        uses: actions/cache/restore@v4
        with:
          path: game_input/*_build/shader
          key: nx2apple-shaders-smo-v1
          restore-keys: |
            nx2apple-shaders-smo-

      - name: Converter XCI para NSP e gerar Slim IPA
        run: |
          KEYS_PATH=$(find game_input -maxdepth 2 -iname "prod.keys*" | head -n 1)
          if [ -z "$KEYS_PATH" ]; then
            echo "ERRO: Arquivo prod.keys nao encontrado dentro do zip!"
            exit 1
          fi
          KEYS_ABS=$(cd "$(dirname "$KEYS_PATH")" && pwd)/$(basename "$KEYS_PATH")
          echo "Usando arquivo de chaves: $KEYS_ABS"

          python3 - "$KEYS_ABS" << 'EOF'
          import os, sys, glob, struct
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

          keys_path = sys.argv[1]
          header_key = None
          with open(keys_path, "r", encoding="utf-8", errors="ignore") as kf:
              for line in kf:
                  if "=" in line:
                      k, v = [x.strip() for x in line.split("=", 1)]
                      if k == "header_key":
                          header_key = bytes.fromhex(v)

          def get_nca_tid(f, abs_offset):
              if not header_key:
                  return None
              f.seek(abs_offset + 0x200)
              sec1 = f.read(0x200)
              if len(sec1) < 0x200:
                  return None
              for endian in ("big", "little"):
                  tweak = (1).to_bytes(16, endian)
                  dec = Cipher(algorithms.AES(header_key), modes.XTS(tweak)).decryptor().update(sec1)
                  if dec[:4] in (b"NCA3", b"NCA2", b"NCA0"):
                      tid = struct.unpack("<Q", dec[0x10:0x18])[0]
                      return f"{tid:016X}"
              return None

          for xci_path in glob.glob("game_input/*.[xX][cC][iI]"):
              print(f"Convertendo XCI para NSP: {xci_path}")
              with open(xci_path, "rb") as f:
                  head = f.read(0x20000)
                  base_off = 0x200 if head[0x300:0x304] == b"HEAD" else 0
                  if head[base_off + 0x100 : base_off + 0x104] == b"HEAD":
                      hfs0_off = base_off + struct.unpack("<Q", head[base_off + 0x130 : base_off + 0x138])[0]
                  else:
                      hfs0_off = 0xF000

                  f.seek(hfs0_off)
                  magic, num_files, str_size, _ = struct.unpack("<4sIII", f.read(16))
                  if magic != b"HFS0":
                      raise RuntimeError(f"HFS0 invalido em {hex(hfs0_off)}")
                  entries = [struct.unpack("<QQIIQ32s", f.read(64)) for _ in range(num_files)]
                  str_tab = f.read(str_size)
                  root_data = hfs0_off + 16 + num_files * 64 + str_size

                  sec_off = None
                  for f_off, f_sz, n_off, _, _, _ in entries:
                      name = str_tab[n_off:].split(b"\x00", 1)[0].decode("utf-8", "ignore")
                      if name == "secure":
                          sec_off = root_data + f_off
                          break
                  if sec_off is None:
                      raise RuntimeError("Particao secure nao encontrada no XCI!")

                  f.seek(sec_off)
                  smagic, snum, sstr_size, _ = struct.unpack("<4sIII", f.read(16))
                  sentries = [struct.unpack("<QQIIQ32s", f.read(64)) for _ in range(snum)]
                  sstr_tab = f.read(sstr_size)
                  sec_data = sec_off + 16 + snum * 64 + sstr_size

                  groups = {}
                  fallback_files = []
                  for f_off, f_sz, n_off, _, _, _ in sentries:
                      fname = sstr_tab[n_off:].split(b"\x00", 1)[0].decode("utf-8", "ignore")
                      abs_off = sec_data + f_off
                      tid = None
                      if fname.lower().endswith(".nca"):
                          tid = get_nca_tid(f, abs_off)
                      elif fname.lower().endswith((".tik", ".cert")) and len(fname) >= 16:
                          tid = fname[:16].upper()
                      if tid:
                          groups.setdefault(tid, []).append((fname, abs_off, f_sz))
                      else:
                          fallback_files.append((fname, abs_off, f_sz))

                  if not groups:
                      groups["0100000000010000"] = fallback_files
                  elif fallback_files:
                      first_tid = sorted(groups.keys())[0]
                      groups[first_tid].extend(fallback_files)

                  for tid, flist in groups.items():
                      # Se for update do Super Mario Odyssey (0100000000010800), usa v393216 (1.4.1)
                      if tid == "0100000000010800":
                          ver = "v393216"
                      elif tid.endswith("800"):
                          ver = "v65536"
                      else:
                          ver = "v0"
                      out_nsp = os.path.join("game_input", f"{tid}_from_xci[{ver}].nsp")
                      print(f"Gerando {out_nsp} ({len(flist)} arquivos)...")
                      str_buf = bytearray()
                      pfs_entries = []
                      cur_off = 0
                      for fname, abs_off, f_sz in flist:
                          n_off = len(str_buf)
                          str_buf.extend(fname.encode("utf-8") + b"\x00")
                          pfs_entries.append((cur_off, f_sz, n_off, abs_off))
                          cur_off += f_sz
                      hdr_len = 16 + len(flist) * 24 + len(str_buf)
                      pad = (32 - (hdr_len % 32)) % 32
                      str_buf.extend(b"\x00" * pad)

                      with open(out_nsp, "wb") as out:
                          out.write(struct.pack("<4sIII", b"PFS0", len(flist), len(str_buf), 0))
                          for rel_off, f_sz, n_off, _ in pfs_entries:
                              out.write(struct.pack("<QQII", rel_off, f_sz, n_off, 0))
                          out.write(str_buf)
                          for _, f_sz, _, abs_off in pfs_entries:
                              f.seek(abs_off)
                              rem = f_sz
                              while rem > 0:
                                  chunk = f.read(min(16 * 1024 * 1024, rem))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  rem -= len(chunk)
              os.remove(xci_path)
          EOF

          # Se ja houver um NSP de update separado (ex: v393216), remove o update extraido do XCI para nao dar conflito
          OTHER_UPD=$(find game_input -maxdepth 1 -iname "*.nsp" ! -name "*_from_xci*" -iname "*v393216*" | head -n 1)
          if [ -n "$OTHER_UPD" ]; then
            rm -f "game_input/0100000000010800_from_xci[v393216].nsp"
          fi

          cd repo
          if ! python3 scripts/build_ipa_from_nsp.py ../game_input -k "$KEYS_ABS" -o ../output_files/SuperMarioOdyssey.ipa --romfs separate --keep-extracted --allow-other-metal --gpu none; then
            echo "=== ULTIMAS 80 LINHAS DO LOG DO XCODEBUILD ==="
            tail -n 80 ../game_input/*_build/ipa/build/ios/pkg/build.log || true
            exit 1
          fi
          rm -f ../game_input/*.nsp

      - name: Salvar Cache de Shaders
        if: always() && steps.cache-shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: game_input/*_build/shader
          key: nx2apple-shaders-smo-v1

      - name: Separar romfs.img gerado
        if: ${{ inputs.gerar_romfs == true }}
        run: |
          ROMFS_IMG=$(find game_input -path "*_build/extract/*/RomFS.img" -type f | sort -V | tail -n 1)
          if [ -n "$ROMFS_IMG" ]; then
            echo "Movendo RomFS.img encontrado em: $ROMFS_IMG"
            mv "$ROMFS_IMG" output_files/romfs/romfs.img
            rm -rf game_input/*_build/extract
            ls -lh output_files/romfs/
          else
            echo "ERRO: Arquivo RomFS.img nao localizado!"
            exit 1
          fi

      - name: Salvar IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-Slim-IPA
          path: output_files/SuperMarioOdyssey.ipa
          compression-level: 0

      - name: Salvar RomFS para download
        if: ${{ inputs.gerar_romfs == true }}
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-RomFS
          path: output_files/romfs/romfs.img
          compression-level: 0
